<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>The Mom Test — Audiobook Player</title>
  
  <!-- Apple Web App & PWA Settings -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mom Test Audio">
  <meta name="theme-color" content="#090d16">
  <link rel="manifest" href="mom_test_pwa.webmanifest">
  
  <!-- iOS App Icon (Audiobook Theme) -->
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%236366f1'/%3E%3Cstop offset='100%25' stop-color='%230ea5e9'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='512' height='512' rx='112' fill='url(%23g)'/%3E%3Ccircle cx='256' cy='256' r='140' fill='rgba(255,255,255,0.15)'/%3E%3Ctext x='256' y='330' font-size='220' text-anchor='middle' fill='%23ffffff'%3E🎧%3C/text%3E%3C/svg%3E">

  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131b2e;
      --card-border: #1f2c47;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --primary: #6366f1;
      --success: #10b981;
      --safe-t: env(safe-area-inset-top, 20px);
      --safe-b: env(safe-area-inset-bottom, 24px);
      --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    }

    [data-theme="light"] {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent: #0284c7;
      --accent-hover: #0369a1;
      --accent-glow: rgba(2, 132, 199, 0.15);
      --primary: #4f46e5;
      --success: #059669;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg);
      color: var(--text-main);
      padding-top: calc(var(--safe-t) + 12px);
      padding-bottom: calc(var(--safe-b) + 32px);
      padding-left: 18px;
      padding-right: 18px;
      max-width: 600px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    /* Top Bar */
    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .badge-audio {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(56, 189, 248, 0.12);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.25);
    }

    .theme-toggle {
      background: none;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      color: var(--text-muted);
      padding: 6px;
    }

    /* Album Art & Hero Card */
    .hero-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 12px 36px rgba(0,0,0,0.25);
      margin-bottom: 22px;
      position: relative;
      overflow: hidden;
    }

    .album-cover {
      width: 140px;
      height: 140px;
      border-radius: 18px;
      background: linear-gradient(135deg, #4f46e5, #0ea5e9);
      margin: 0 auto 16px auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(14, 165, 233, 0.35);
      position: relative;
    }

    .album-icon {
      font-size: 50px;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
    }

    .album-tag {
      font-size: 0.65rem;
      font-weight: 800;
      color: white;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: rgba(0,0,0,0.25);
      padding: 2px 8px;
      border-radius: 6px;
      margin-top: 4px;
    }

    .book-title {
      font-size: 1.25rem;
      font-weight: 800;
      margin-bottom: 4px;
      letter-spacing: -0.3px;
    }

    .book-author {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    /* Track Display in Hero */
    .now-playing-box {
      background: rgba(0,0,0,0.15);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 18px;
      text-align: left;
    }

    .now-track-num {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .now-track-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-main);
      margin: 2px 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .now-track-sub {
      font-size: 0.72rem;
      color: var(--text-muted);
      line-height: 1.35;
    }

    /* Progress & Scrubber */
    .progress-area {
      margin-bottom: 16px;
    }

    .scrubber {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: var(--card-border);
      outline: none;
      cursor: pointer;
    }

    .scrubber::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent-glow);
      cursor: pointer;
    }

    .time-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      color: var(--text-muted);
      font-family: ui-monospace, SFMono-Regular, monospace;
      margin-top: 6px;
    }

    /* Main Player Controls */
    .controls-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 18px;
      margin-bottom: 16px;
    }

    .btn-control {
      background: none;
      border: none;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s ease, color 0.1s ease;
    }
    .btn-control:active { transform: scale(0.92); }

    .btn-skip {
      font-size: 1.35rem;
      color: var(--text-muted);
    }

    .btn-play {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--accent);
      color: #090d16;
      font-size: 1.8rem;
      box-shadow: 0 8px 24px var(--accent-glow);
    }
    .btn-play:hover { background: var(--accent-hover); }

    /* Extra Tools: Speed & Sleep */
    .tools-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--card-border);
      padding-top: 14px;
      margin-top: 6px;
    }

    .speed-pills {
      display: flex;
      gap: 6px;
    }

    .pill {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 8px;
      cursor: pointer;
    }
    .pill.active {
      background: var(--accent);
      color: #090d16;
      border-color: var(--accent);
    }

    .sleep-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .sleep-btn.active {
      color: var(--accent);
      border-color: var(--accent);
    }

    /* Chapter List */
    .tracklist-header {
      font-size: 0.85rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
    }

    .tracklist {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .track-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .track-card:active {
      transform: scale(0.98);
    }
    .track-card.active {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.08);
    }

    .track-num {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-muted);
      flex-shrink: 0;
    }
    .track-card.active .track-num {
      background: var(--accent);
      color: #090d16;
    }

    .track-content {
      flex: 1;
      min-width: 0;
    }

    .track-name {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-desc {
      font-size: 0.72rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .track-meta {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 600;
      flex-shrink: 0;
      text-align: right;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="nav-bar">
    <div class="badge-audio">🎧 Neural Audiobook · Unabridged</div>
    <button class="theme-toggle" id="btnTheme" title="Toggle Theme">🌓</button>
  </div>

  <!-- Hero Player Card -->
  <div class="hero-card">
    <div class="album-cover">
      <div class="album-icon">🎯</div>
      <div class="album-tag">Audiobook</div>
    </div>

    <div class="book-title">The Mom Test</div>
    <div class="book-author">By Rob Fitzpatrick · Narrated Unabridged</div>

    <!-- Current Playing Details -->
    <div class="now-playing-box">
      <div class="now-track-num" id="nowNum">Track 01 of 10</div>
      <div class="now-track-title" id="nowTitle">Introduction & Setup</div>
      <div class="now-track-sub" id="nowSub">Excavating delicate archaeological sites & why founders do it wrong</div>
    </div>

    <!-- Scrubber -->
    <div class="progress-area">
      <input type="range" class="scrubber" id="progressBar" min="0" max="100" value="0">
      <div class="time-row">
        <span id="currentTime">00:00</span>
        <span id="totalDuration">--:--</span>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls-row">
      <button class="btn-control btn-skip" id="btnPrev" title="Previous Chapter">⏮️</button>
      <button class="btn-control btn-skip" id="btnRewind" title="Rewind 15s">⏪ 15s</button>
      <button class="btn-control btn-play" id="btnPlay" title="Play / Pause">▶</button>
      <button class="btn-control btn-skip" id="btnForward" title="Forward 15s">15s ⏩</button>
      <button class="btn-control btn-skip" id="btnNext" title="Next Chapter">⏭️</button>
    </div>

    <!-- Speed & Sleep Tools -->
    <div class="tools-row">
      <div class="speed-pills">
        <button class="pill active" onclick="setSpeed(1.0, this)">1.0×</button>
        <button class="pill" onclick="setSpeed(1.25, this)">1.25×</button>
        <button class="pill" onclick="setSpeed(1.5, this)">1.5×</button>
        <button class="pill" onclick="setSpeed(1.75, this)">1.75×</button>
        <button class="pill" onclick="setSpeed(2.0, this)">2.0×</button>
      </div>
      <button class="sleep-btn" id="btnSleep" onclick="cycleSleepTimer()">🌙 Sleep: Off</button>
    </div>
  </div>

  <!-- Chapters Tracklist -->
  <div class="tracklist-header">
    <span>Chapters (10 Tracks)</span>
    <span id="totalBookTime">~2.5 Hours</span>
  </div>

  <div class="tracklist" id="tracklistContainer">
    <!-- Populated by JS -->
  </div>

  <audio id="audio" preload="metadata"></audio>

  <script>
    const CHAPTERS = [
      {
        id: "00",
        title: "Introduction & Setup",
        subtitle: "Excavating delicate archaeological sites & why founders get lied to",
        file: "audio/00_Introduction.mp3",
        duration: "6:18"
      },
      {
        id: "01",
        title: "Chapter 1: The Mom Test",
        subtitle: "The 3 rules: talk about their life, ask about past specifics, listen more than talk",
        file: "audio/01_The_Mom_Test.mp3",
        duration: "20:47"
      },
      {
        id: "02",
        title: "Chapter 2: Avoiding Bad Data",
        subtitle: "The 3 toxic traps: Compliments, Fluff (hypotheticals), and Feature Requests",
        file: "audio/02_Avoiding_Bad_Data.mp3",
        duration: "26:14"
      },
      {
        id: "03",
        title: "Chapter 3: Asking Important Questions",
        subtitle: "Preparing your List of 3, uncovering world-ending risks & asking the dreaded questions",
        file: "audio/03_Asking_Important_Questions.mp3",
        duration: "25:00"
      },
      {
        id: "04",
        title: "Chapter 4: Keeping It Casual",
        subtitle: "No formal pitch meetings, coffee chats, and conversational customer development",
        file: "audio/04_Keeping_It_Casual.mp3",
        duration: "9:12"
      },
      {
        id: "05",
        title: "Chapter 5: Commitment & Advancement",
        subtitle: "The currency of commitment: Time, Reputation, and Cash vs False Enthusiasm",
        file: "audio/05_Commitment_and_Advancement.mp3",
        duration: "14:45"
      },
      {
        id: "06",
        title: "Chapter 6: Finding Conversations",
        subtitle: "Warm intros, cold outreach, landing in natural habitats, and the Advisory Flip",
        file: "audio/06_Finding_Conversations.mp3",
        duration: "21:01"
      },
      {
        id: "07",
        title: "Chapter 7: Choosing Your Customers",
        subtitle: "Customer segmentation, narrowing down early adopters, and slicing until you find fanatics",
        file: "audio/07_Choosing_Your_Customers.mp3",
        duration: "15:04"
      },
      {
        id: "08",
        title: "Chapter 8: Running the Process",
        subtitle: "Note-taking protocols, debriefing in pairs, avoiding zombie meetings & sharing notes",
        file: "audio/08_Running_the_Process.mp3",
        duration: "18:14"
      },
      {
        id: "09",
        title: "Conclusion & Master Cheatsheet",
        subtitle: "The complete Mom Test playbook & rapid diagnostic checklist",
        file: "audio/09_Conclusion_and_Cheatsheet.mp3",
        duration: "8:01"
      }
    ];

    let currentTrackIdx = 0;
    let isPlaying = false;
    let playbackRate = 1.0;
    let sleepTimerMinutes = 0;
    let sleepTimerTimeout = null;

    const audio = document.getElementById("audio");
    const btnPlay = document.getElementById("btnPlay");
    const btnPrev = document.getElementById("btnPrev");
    const btnNext = document.getElementById("btnNext");
    const btnRewind = document.getElementById("btnRewind");
    const btnForward = document.getElementById("btnForward");
    const progressBar = document.getElementById("progressBar");
    const currentTimeEl = document.getElementById("currentTime");
    const totalDurationEl = document.getElementById("totalDuration");
    const nowNumEl = document.getElementById("nowNum");
    const nowTitleEl = document.getElementById("nowTitle");
    const nowSubEl = document.getElementById("nowSub");
    const tracklistEl = document.getElementById("tracklistContainer");
    const btnTheme = document.getElementById("btnTheme");
    const btnSleep = document.getElementById("btnSleep");

    // Format mm:ss
    function formatTime(secs) {
      if (isNaN(secs)) return "00:00";
      const m = Math.floor(secs / 60);
      const s = Math.floor(secs % 60);
      return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
    }

    // Render Tracklist
    function renderTracklist() {
      tracklistEl.innerHTML = CHAPTERS.map((c, i) => `
        <div class="track-card ${i === currentTrackIdx ? 'active' : ''}" onclick="selectTrack(${i})">
          <div class="track-num">${c.id}</div>
          <div class="track-content">
            <div class="track-name">${c.title}</div>
            <div class="track-desc">${c.subtitle}</div>
          </div>
          <div class="track-meta">⏱️ ${c.duration}</div>
        </div>
      `).join("");
    }

    // Load Track
    function loadTrack(idx, autoPlay = false) {
      currentTrackIdx = idx;
      const c = CHAPTERS[idx];
      audio.src = c.file;
      audio.playbackRate = playbackRate;

      nowNumEl.innerText = `Track ${idx + 1} of ${CHAPTERS.length}`;
      nowTitleEl.innerText = c.title;
      nowSubEl.innerText = c.subtitle;

      renderTracklist();
      updateMediaSession(c);

      // Save state to localStorage
      localStorage.setItem("mom_test_last_track", idx);

      if (autoPlay) {
        audio.play().then(() => {
          isPlaying = true;
          btnPlay.innerText = "⏸";
        }).catch(() => {});
      }
    }

    // Select Track from List
    window.selectTrack = function(idx) {
      if (idx === currentTrackIdx && isPlaying) {
        togglePlay();
      } else {
        loadTrack(idx, true);
      }
    };

    // Toggle Play/Pause
    function togglePlay() {
      if (audio.paused) {
        audio.play().then(() => {
          isPlaying = true;
          btnPlay.innerText = "⏸";
        }).catch(err => console.error(err));
      } else {
        audio.pause();
        isPlaying = false;
        btnPlay.innerText = "▶";
      }
    }
    btnPlay.addEventListener("click", togglePlay);

    // Prev / Next
    btnPrev.addEventListener("click", () => {
      if (audio.currentTime > 5) {
        audio.currentTime = 0;
      } else if (currentTrackIdx > 0) {
        loadTrack(currentTrackIdx - 1, true);
      }
    });

    btnNext.addEventListener("click", () => {
      if (currentTrackIdx < CHAPTERS.length - 1) {
        loadTrack(currentTrackIdx + 1, true);
      }
    });

    // Skip 15s
    btnRewind.addEventListener("click", () => {
      audio.currentTime = Math.max(0, audio.currentTime - 15);
    });
    btnForward.addEventListener("click", () => {
      audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 15);
    });

    // Audio Event Listeners
    audio.addEventListener("timeupdate", () => {
      if (!isNaN(audio.duration) && audio.duration > 0) {
        const pct = (audio.currentTime / audio.duration) * 100;
        progressBar.value = pct;
        currentTimeEl.innerText = formatTime(audio.currentTime);
        totalDurationEl.innerText = formatTime(audio.duration);

        // Auto save timestamp every few seconds
        localStorage.setItem("mom_test_last_time", Math.floor(audio.currentTime));
      }
    });

    audio.addEventListener("loadedmetadata", () => {
      totalDurationEl.innerText = formatTime(audio.duration);
    });

    // Auto Advance to next chapter
    audio.addEventListener("ended", () => {
      if (sleepTimerMinutes === "chapter") {
        clearSleepTimer();
        return;
      }
      if (currentTrackIdx < CHAPTERS.length - 1) {
        loadTrack(currentTrackIdx + 1, true);
      } else {
        isPlaying = false;
        btnPlay.innerText = "▶";
      }
    });

    // Scrubber drag
    progressBar.addEventListener("input", (e) => {
      if (!isNaN(audio.duration)) {
        audio.currentTime = (e.target.value / 100) * audio.duration;
      }
    });

    // Speed Controller
    window.setSpeed = function(rate, el) {
      playbackRate = rate;
      audio.playbackRate = rate;
      document.querySelectorAll(".speed-pills .pill").forEach(p => p.classList.remove("active"));
      el.classList.add("active");
      localStorage.setItem("mom_test_speed", rate);
    };

    // Sleep Timer
    const SLEEP_MODES = [0, 15, 30, 45, "chapter"];
    let sleepModeIdx = 0;

    window.cycleSleepTimer = function() {
      sleepModeIdx = (sleepModeIdx + 1) % SLEEP_MODES.length;
      const mode = SLEEP_MODES[sleepModeIdx];
      sleepTimerMinutes = mode;

      if (sleepTimerTimeout) clearTimeout(sleepTimerTimeout);

      if (mode === 0) {
        btnSleep.innerText = "🌙 Sleep: Off";
        btnSleep.classList.remove("active");
      } else if (mode === "chapter") {
        btnSleep.innerText = "🌙 End of Ch.";
        btnSleep.classList.add("active");
      } else {
        btnSleep.innerText = `🌙 ${mode} min`;
        btnSleep.classList.add("active");
        sleepTimerTimeout = setTimeout(() => {
          audio.pause();
          isPlaying = false;
          btnPlay.innerText = "▶";
          clearSleepTimer();
        }, mode * 60 * 1000);
      }
    };

    function clearSleepTimer() {
      sleepModeIdx = 0;
      sleepTimerMinutes = 0;
      if (sleepTimerTimeout) clearTimeout(sleepTimerTimeout);
      btnSleep.innerText = "🌙 Sleep: Off";
      btnSleep.classList.remove("active");
    }

    // MediaSession API (Lock Screen & Background Audio Control on iOS)
    function updateMediaSession(c) {
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: c.title,
          artist: "Rob Fitzpatrick",
          album: "The Mom Test",
          artwork: [
            {
              src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' fill='%236366f1'/%3E%3Ctext x='256' y='330' font-size='220' text-anchor='middle' fill='%23ffffff'%3E🎧%3C/text%3E%3C/svg%3E",
              sizes: "512x512",
              type: "image/svg+xml"
            }
          ]
        });

        navigator.mediaSession.setActionHandler('play', () => togglePlay());
        navigator.mediaSession.setActionHandler('pause', () => togglePlay());
        navigator.mediaSession.setActionHandler('seekbackward', () => { audio.currentTime = Math.max(0, audio.currentTime - 15); });
        navigator.mediaSession.setActionHandler('seekforward', () => { audio.currentTime = Math.min(audio.duration, audio.currentTime + 15); });
        navigator.mediaSession.setActionHandler('previoustrack', () => {
          if (currentTrackIdx > 0) loadTrack(currentTrackIdx - 1, true);
        });
        navigator.mediaSession.setActionHandler('nexttrack', () => {
          if (currentTrackIdx < CHAPTERS.length - 1) loadTrack(currentTrackIdx + 1, true);
        });
      }
    }

    // Theme Toggle
    const savedTheme = localStorage.getItem("mom_test_theme") || "dark";
    document.documentElement.setAttribute("data-theme", savedTheme);
    btnTheme.addEventListener("click", () => {
      const cur = document.documentElement.getAttribute("data-theme");
      const next = cur === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("mom_test_theme", next);
    });

    // Auto Restore Last Played Session
    window.addEventListener("DOMContentLoaded", () => {
      const savedTrack = parseInt(localStorage.getItem("mom_test_last_track") || "0", 10);
      const savedTime = parseFloat(localStorage.getItem("mom_test_last_time") || "0");
      const savedSpeed = parseFloat(localStorage.getItem("mom_test_speed") || "1.0");

      playbackRate = savedSpeed;
      loadTrack(savedTrack, false);

      // Restore time once audio can play
      audio.addEventListener("canplay", function onCanPlay() {
        if (savedTime > 0 && savedTime < audio.duration) {
          audio.currentTime = savedTime;
        }
        audio.removeEventListener("canplay", onCanPlay);
      });

      // Highlight correct speed pill
      document.querySelectorAll(".speed-pills .pill").forEach(p => {
        if (parseFloat(p.innerText) === playbackRate) {
          p.classList.add("active");
        } else {
          p.classList.remove("active");
        }
      });
    });

    // Register PWA Service Worker for offline
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./mom_test_sw.js').catch(() => {});
      });
    }
  </script>

</body>
